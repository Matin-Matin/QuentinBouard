<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>QUENTIN BOUARD</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body class="portfolio-page">
    <header class="portfolio-header">
        <a class="portfolio-name" href="index.html">QUENTIN BOUARD</a>
        <a class="portfolio-language" href="en/index-en.html">EN</a>
    </header>
    <main class="portfolio-layout">
        <aside class="project-navigation" aria-label="Projets">
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
            <nav id="project-navigation"></nav>
        </aside>
        <section class="project-view" id="project-view" aria-live="polite"></section>
    </main>
    <div class="lightbox-overlay" id="lightbox" aria-hidden="true">
        <button class="lightbox-close" type="button" aria-label="Fermer">×</button><img alt="">
    </div>
    <script>
        const projects = [
            { name: 'Alba', images: ['image-01.png', 'image-02.png', 'image-03.jpg'] },
            { name: 'Articulation', images: ['image-01.jpg'], video: false },
            { name: 'Danse pinéale', images: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg'] },
            { name: 'Don contre don', images: ['image-01.jpg'], video: false },
            { name: 'Feelings are fact', images: ['image-01.jpg'], video: false },
            { name: 'Népomucène', folder: 'Népomucène', images: ['image-01.png'], video: false },
            { name: 'Installation amphitéatre', images: ['Diplome_Page_01_Image_0001.jpg', 'Diplome_Page_02_Image_0001.jpg', 'Diplome_Page_03_Image_0001.jpg', 'Diplome_Page_04_Image_0001.jpg', 'Diplome_Page_05_Image_0001.jpg', 'Diplome_Page_06_Image_0001.jpg', 'Diplome_Page_07_Image_0001.jpg', 'Diplome_Page_08_Image_0001.jpg', 'Diplome_Page_09_Image_0001.jpg', 'Diplome_Page_10_Image_0001.jpg', 'Diplome_Page_11_Image_0001.jpg', 'Diplome_Page_12_Image_0001.jpg', 'Diplome_Page_13_Image_0001.jpg', 'Diplome_Page_014_Image_0009.jpg'], video: false },
            { name: "Retour d'expérience", images: ['1.png', '2.png', '3.jpg'] },
            { name: 'Si polie soit la République', folder: 'Si polie soit la République', images: ['1.png', '2.png', '3.jpg'] },
            { name: 'Tada - Théatre de sculpture', folder: 'Tada _ Théatre de sculpture', images: ['image-01.jpg', 'image-02.jpg', 'image-03.jpg', 'image-04.jpg', 'image-05.jpg', 'image-06.jpg', 'image-07.jpg', 'image-08.jpg', 'image-09.jpg', 'image-10.jpg', 'image-11.jpg', 'image-12.jpg', 'image-13.jpg', 'image-14.jpg', 'image-15.jpg', 'image-16.jpg', 'image-17.jpg', 'image-18.jpg', 'image-19.jpg', 'image-20.jpg', 'image-21.jpg', 'image-22.jpg', 'image-23.jpg', 'image-24.jpg', 'image-25.jpg', 'image-26.jpg', 'image-27.jpg', 'image-28.jpg', 'image-29.jpg', 'image-30.jpg', 'image-31.jpg', 'image-32.jpg', 'image-33.jpg', 'image-34.jpg', 'image-35.jpg', 'image-36.jpg', 'image-37.jpg', 'image-38.jpg', 'image-39.jpg', 'image-40.jpg', 'image-41.jpg', 'image-42.jpg', 'image-43.jpg', 'image-44.jpg', 'image-45.jpg', 'image-46.jpg', 'image-47.jpg', 'image-48.jpg', 'image-49.jpg', 'image-50.jpg'] }
        ];
        projects.find((project) => project.name === 'Tada - Théatre de sculpture').images = ['1.jpg', ...Array.from({ length: 49 }, (_, index) => `web-${String(index + 2).padStart(2, '0')}.jpg`)];
        const projectNotes = {
            'Alba': 'En collaboration avec Lino Jericot Garcia.',
            'Danse pinéale': `Séance en visio live avec un psychiatre secteur 1.
Un problème de caméra cassée a été prétexté pour
que le psychiatre ignore le procédé. Le public est
placé face à la visio. L’analysé danse et dialogue par
le microphone.`,
            'Feelings are fact': 'Récolte de larmes sur papier buvard conçu pour le stockage du LSD. Chaque larme est nommée selon l’initiale de son·sa producteur·ice.',
            'Népomucène': `Pendant la résidence XXIX CSAV, suite à un deuil,
chaque jour, j’ai ajouté des fleurs à la statut du saint
Jean de Népomucène tournant le dos au lac de
Como.`,
            'Installation amphitéatre': `L’identité nationale française est une structure en équilibre sur nos corps. Comme toute technique d’organisation sociale, elle déforme et informe la---chair. L’extrême droite l’érige comme naturelle et---droite ; elle creuse, désirante que les spectres du---fascisme se réincarnent.---En prenant l’amphithéâtre des Loges, je viens---frotter des gestes plastiques sur le théâtre d’une---opposition architecturale : l’équilibre entre une---masse et une figure. De là, j’incline le bureau central---comme une proposition symbolique et motrice.---Face à la crise actuelle de la culture et à la montée---du fascisme, que peuvent/doivent les formes, si ce---n’est (re)mettre en mouvement l’appareil sensible et---critique ?---Les horreurs de la Seconde Guerre mondiale,---et la guerre d’Algérie à sa suite, hantent. Le retour---au pire ne se combattra pas par la satire et la---tristesse, mais dans une joie motrice et malicieuse.`,
            "Retour d'expérience": 'En collaboration avec Brune de Maurin.',
            'Si polie soit la République': `L’identité nationale française est une structure---en équilibre sur nos corps. Comme toute technique---d’organisation sociale, elle déforme et informe la---chair. L’extrême droite l’érige comme naturelle et---droite ; elle creuse, désirante que les spectres du---fascisme se réincarnent.---En prenant l’amphithéâtre des Loges, je viens---frotter des gestes plastiques sur le théâtre d’une---opposition architecturale : l’équilibre entre une---masse et une figure. De là, j’incline le bureau central---comme une proposition symbolique et motrice.---Face à la crise actuelle de la culture et à la montée---du fascisme, que peuvent/doivent les formes, si ce---n’est (re)mettre en mouvement l’appareil sensible et---critique ?---Les horreurs de la Seconde Guerre mondiale,---et la guerre d’Algérie à sa suite, hantent. Le retour---au pire ne se combattra pas par la satire et la---tristesse, mais dans une joie motrice et malicieuse.`,
            'Tada - Théatre de sculpture': 'J’invite 18 artistes à venir présenter un objet pendant un spectacle. L’objet apparaît deux fois pendant un temps de contemplation. Il s’agit ici de détourner le dispositif d’attention propre au spectacle vivant (black box) pour faire l’expérience d’objets plastiques, autrement dit, d’un théâtre de sculptures.'
        };
        projectNotes['Installation amphitéatre'] = 'L’identité nationale française est une structure en équilibre sur nos corps. Comme toute technique d’organisation sociale, elle déforme et informe la chair. L’extrême droite l’érige comme naturelle et droite ; elle creuse, désirante que les spectres du fascisme se réincarnent.---En prenant l’amphithéâtre des Loges, je viens frotter des gestes plastiques sur le théâtre d’une opposition architecturale : l’équilibre entre une masse et une figure. De là, j’incline le bureau central comme une proposition symbolique et motrice. Face à la crise actuelle de la culture et à la montée du fascisme, que peuvent/doivent les formes, si ce n’est (re)mettre en mouvement l’appareil sensible et critique ?---Les horreurs de la Seconde Guerre mondiale, et la guerre d’Algérie à sa suite, hantent. Le retour au pire ne se combattra pas par la satire et la tristesse, mais dans une joie motrice et malicieuse.';
        projectNotes['Si polie soit la République'] = "J'éléve un drapeau français fixé à un montant métallique pour cloison , en équilibre sur mon menton. Je descends ensuite les escaliers de la station de métro Stalingrad, à Paris. La silhouette de cinq mètres que je compose ne peut franchir l'entrée de la station. La mise en scène de l'identité nationale se brise contre ce lieu.";
        projects.forEach((project) => project.note = projectNotes[project.name] || '');
        projects.find((project) => project.name === 'Tada - Théatre de sculpture').videoAfterFirst = true;
        const formatNote = (note) => note.replace(/\s*---\s*/g, '\u0000').replace(/\s+/g, ' ').replace(/\u0000/g, '\n\n').trim();
        const youtubeUrls = {
            'Alba': 'https://youtu.be/GfwcvXI_hOc',
            'Articulation': '',
            'Danse pinéale': 'https://youtu.be/74ylOKGtsgg',
            'Don contre don': '',
            'Feelings are fact': '',
            'Installation amphitéatre': '',
            "Retour d'expérience": 'https://youtu.be/SBtEdpwIohg',
            'Si polie soit la République': 'https://www.youtube.com/embed/Eoz-hb305A8?si=aeGIusXeKFkTl-U6',
            'Tada - Théatre de sculpture': ''
        };
        const accentColors = ['#c40000', '#cc1717', '#d02020', '#c92a2a', '#d13a2f'];
        const setAccentColor = () => document.documentElement.style.setProperty('--accent-color', accentColors[Math.floor(Math.random() * accentColors.length)]);
        const navigation = document.getElementById('project-navigation');
        const view = document.getElementById('project-view');
        const slugify = (name) => name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        function toEmbedUrl(url) {
            if (!url) return '';
            try {
                const parsedUrl = new URL(url);
                if (parsedUrl.hostname === 'youtu.be') return `https://www.youtube.com/embed/${parsedUrl.pathname.slice(1)}${parsedUrl.search}`;
                if (parsedUrl.hostname.includes('youtube.com') && parsedUrl.pathname === '/watch') {
                    const videoId = parsedUrl.searchParams.get('v');
                    if (!videoId) return url;
                    parsedUrl.searchParams.delete('v');
                    return `https://www.youtube.com/embed/${videoId}${parsedUrl.search}`;
                }
                return url;
            } catch {
                return url;
            }
        }
        projects.forEach((project) => {
            const link = document.createElement('a');
            link.href = `#${slugify(project.name)}`;
            link.textContent = project.name;
            link.dataset.project = project.name;
            navigation.appendChild(link);
        });
        function renderProject(project) {
            setAccentColor();
            document.title = `QUENTIN BOUARD — ${project.name.toUpperCase()}`;
            const folder = project.folder || project.name;
            const videoUrl = toEmbedUrl(youtubeUrls[project.name]);
            const video = videoUrl ? `<figure class="project-video"><iframe src="${videoUrl}" title="Vidéo — ${project.name}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></figure>` : '';
            const projectClass = ['feelings-are-fact', 'don-contre-don'].includes(slugify(project.name)) ? ' feelings-project' : '';
            view.classList.toggle('feelings-view', projectClass !== '');
            view.innerHTML = `<div class="project-media${projectClass}">${project.images.map((image, index) => `<figure class="project-image${project.name === 'Danse pinéale' && index === 0 ? ' project-image--accueil' : ''}"><img src="Nouveau site/${folder}/${image}" alt="${project.name}, image ${index + 1}" loading="eager"></figure>${project.videoAfterFirst && index === 0 ? video : ''}`).join('')}${project.videoAfterFirst ? '' : video}</div>`;
            if (project.note) {
                const noteElement = document.createElement('p');
                noteElement.className = `project-note${projectClass ? ' feelings-note' : ''}`;
                noteElement.textContent = formatNote(project.note);
                const firstImage = view.querySelector('.project-image');
                const videoElement = view.querySelector('.project-video');
                (project.videoAfterFirst && videoElement ? videoElement : firstImage).after(noteElement);
            }
            navigation.querySelectorAll('a').forEach((link) => link.classList.toggle('active', link.dataset.project === project.name));
            window.scrollTo({ top: 0, behavior: 'instant' });
        }
        function selectProject() {
            const selected = projects.find((project) => slugify(project.name) === window.location.hash.slice(1)) || projects.find((project) => project.name === 'Danse pinéale');
            renderProject(selected);
        }
        window.addEventListener('hashchange', selectProject);
        selectProject();
        const overlay = document.getElementById('lightbox');
        const overlayImage = overlay.querySelector('img');
        const closeLightbox = () => { overlay.classList.remove('visible'); overlay.setAttribute('aria-hidden', 'true'); overlayImage.src = ''; };
        view.addEventListener('click', (event) => { if (event.target.tagName === 'IMG') { overlayImage.src = event.target.src; overlayImage.alt = event.target.alt; overlay.classList.add('visible'); overlay.setAttribute('aria-hidden', 'false'); } });
        overlay.addEventListener('click', closeLightbox);
        overlay.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeLightbox(); });
        overlayImage.addEventListener('click', (event) => event.stopPropagation());
    </script>
</body>
</html>
