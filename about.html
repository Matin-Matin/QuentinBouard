        const accentColors = ['#c40000', '#cc1717', '#d02020', '#c92a2a', '#d13a2f'];
        document.documentElement.style.setProperty('--accent-color', accentColors[Math.floor(Math.random() * accentColors.length)]);

    <script>
        const fallbackText = `## RÉSIDENCES / EXPOSITIONS
    2026 | Résidence au Centro Luigi di Sarro, Rome – ARP 12 EDITION
    2026 | Bourse Bredin Prat
    2026 | Festival Et1celle à la La Gaîté Lyrique - Alba
    2025 | Performance au Musée d’Orsay - Camille Claudel,
    L’art au bout des doigts.
    2025 | Résidence à la Fondation Antonio Ratti, Italie – CSAV Artists’ Research Laboratory,
    Low Realisms dirigé par Ed Atkins.
    2025 | Exposition collective, Petite Galerie Françoise Besson –
    En chair et en os

    ## FORMATION
    2025-2026 | DNA Beaux-Arts de Paris
    2023-2025 | École Nationale des Beaux-Arts de Lyon
    2020-2021 | Master 1 de Philosophie Éthique à Strasbourg (CEERE)

    ## STAGE / ASSISTANCE
    2025 | Myriam Leowitz / Chorégraphe – Aide à la création d'une pièce pour Playground
    2025 | Florian Fouché / Plasticien – Montage de l'exposition
    SÉCURITÉ SOCIALE PRÉLUDE – Vies institutionnelles à Bétonsalon
    2024 | Florian Fouché / Plasticien – Assistance pour l'exposition
    FIN DE PARTIE PRÉLUDE au centre d'art GwinZegal`;
        const content = document.getElementById('about-content');
        function renderAbout(text) {
            content.innerHTML = text.trim().split(/\n\s*\n/).map((section) => {
                const lines = section.split('\n');
                const title = lines.shift().trim().replace(/^#+\s*/, '');
                const entries = lines.reduce((groupedLines, line) => {
                    if (line.includes(' | ') || groupedLines.length === 0) groupedLines.push(line.trim());
                    else groupedLines[groupedLines.length - 1] += ` ${line.trim()}`;
                    return groupedLines;
                }, []);
                return `<section class="about-section"><h1>${title}</h1>${entries.map((line) => {
                    const separator = line.indexOf(' | ');
                    if (separator < 0) return `<p class="about-continuation">${line}</p>`;
                    return `<p><span>${line.slice(0, separator)}</span>${line.slice(separator + 3)}</p>`;
                }).join('')}</section>`;
            }).join('');
        }
        renderAbout(fallbackText);
        fetch('about.txt?v=3', { cache: 'no-store' }).then((response) => {
            if (!response.ok) throw new Error('About text unavailable');
            return response.text();
        }).then(renderAbout).catch(() => {});
    </script>
